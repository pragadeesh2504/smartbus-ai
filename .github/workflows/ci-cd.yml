name: SmartBus AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-backend:
    name: Java Spring Boot CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test Backend
        run: |
          cd smartbus-backend
          mvn clean test

  build-frontend:
    name: React SPA CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: smartbus-frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd smartbus-frontend
          npm ci

      - name: Run Build Verify
        run: |
          cd smartbus-frontend
          npm run build
