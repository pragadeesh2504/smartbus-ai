spring:
  application:
    name: smartbus-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/smartbus}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: SmartBusHikariPool
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:300000} # 5 minutes
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:20000} # 20 seconds
      max-lifetime: ${HIKARI_MAX_LIFETIME:1200000} # 20 minutes
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION_THRESHOLD:0}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    serialization:
      fail-on-empty-beans: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${PORT:8080}
  shutdown: graceful
  servlet:
    context-path: /api

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.smartbus: ${SMARTBUS_LOG_LEVEL:INFO}
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate: WARN

app:
  jwt:
    secret: ${JWT_SECRET} # Must be provided via environment variable in production
    expiration-ms: ${JWT_EXPIRATION:3600000} # 1 hour default
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${SMARTBUS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}}
  rate-limit:
    login:
      max-attempts: ${RATE_LIMIT_LOGIN_MAX:10}
      window-seconds: ${RATE_LIMIT_LOGIN_WINDOW:60}
    gps:
      max-requests: ${RATE_LIMIT_GPS_MAX:60}
      window-seconds: ${RATE_LIMIT_GPS_WINDOW:60}
    export:
      max-requests: ${RATE_LIMIT_EXPORT_MAX:10}
      window-seconds: ${RATE_LIMIT_EXPORT_WINDOW:60}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  seed-demo-data: ${SEED_DEMO_DATA:false}

smartbus:
  simulation:
    enabled: ${SMARTBUS_SIMULATION_ENABLED:false}
    interval-ms: 5000

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/smartbus}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  seed-demo-data: ${SEED_DEMO_DATA:false}
  rate-limit:
    login:
      max-attempts: ${LOGIN_RATE_LIMIT_MAX:100}
      window-seconds: 60
    gps:
